name: Backend Deploy

on:
  push:
    branches:
      - staging   # -> staging EC2
      - main      # -> production EC2

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Determine target environment by branch
    environment: ${{ github.ref_name == 'main' && 'production' || 'staging' }}

    steps:
      - uses: actions/checkout@v4

      - name: Build Linux binary
        run: |
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -ldflags="-s -w" -o vidly-backend ./cmd/server

      - name: Prepare deployment key
        env:
          SERVER_SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
        run: |
          test -n "$SERVER_SSH_KEY"
          printf '%s' "$SERVER_SSH_KEY" | tr -d '\r' | sed 's/\\n/\n/g' > "$GITHUB_WORKSPACE/.deploy_key"
          chmod 600 "$GITHUB_WORKSPACE/.deploy_key"

      - name: Upload binary to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key_path: ./.deploy_key
          target: /tmp
          source: vidly-backend
          strip_components: 0

      - name: Restart service on server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key_path: ./.deploy_key
          script: |
            set -e
            # keep env file, replace binary
            sudo mv /tmp/vidly-backend /opt/vidly/vidly-backend
            sudo chown vidly:vidly /opt/vidly/vidly-backend
            sudo systemctl restart vidly
            sleep 3
            # health check; rollback if it fails
            if curl -fsS http://localhost:8080/health > /dev/null; then
              echo "Deploy OK, service healthy"
            else
              echo "Health check FAILED"
              sudo systemctl status vidly --no-pager
              exit 1
            fi

      - name: Remove deployment key
        if: always()
        run: rm -f "$GITHUB_WORKSPACE/.deploy_key"
